services:
  postgres:
    image: postgres:16-alpine
    container_name: aivoa-postgres
    environment:
      POSTGRES_DB: aivoa_complaints
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa -d aivoa_complaints"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

